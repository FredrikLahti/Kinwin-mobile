# Minimal local-only Supabase CLI project config. Used exclusively by
# `supabase start` in CI (see .github/workflows/supabase-e2e.yml) to run the
# real GoTrue + PostgREST layer this repo's hand-built Postgres test harness
# (supabase/tests/) cannot reach, and now also the local Edge Runtime for
# supabase/functions/ (see docs/PAYMENT_SETUP.md). Never pointed at a hosted
# project.
project_id = "kinwin-mobile"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = true

# Requires a real, verified Supabase user JWT — derives the caller from it,
# never from the request body.
[functions.create-consequence-setup-intent]
verify_jwt = true

# Stripe never sends a Supabase JWT; its own HMAC signature (verified inside
# the function, before anything else is trusted) is this endpoint's real
# boundary. See supabase/functions/stripe-consequence-webhook/index.ts.
[functions.stripe-consequence-webhook]
verify_jwt = false

# Requires a real, verified Supabase user JWT — derives the caller from it,
# never from the request body. See supabase/functions/append-check-in-event/index.ts.
[functions.append-check-in-event]
verify_jwt = true

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
