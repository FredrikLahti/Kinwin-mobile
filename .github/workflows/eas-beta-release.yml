name: EAS beta release (manual)

# Manual-only bootstrap/release workflow: authenticates to Expo/EAS with the
# EXPO_TOKEN repository secret (https://docs.expo.dev/eas-update/github-actions/),
# links this repo to a real EAS project if it isn't linked yet, and then
# attempts the actual beta iOS build using the existing internal-distribution
# "beta" profile in eas.json. Never runs on push/PR — only on demand.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eas-beta-release:
    name: Bootstrap EAS and attempt iOS beta build
    runs-on: ubuntu-latest
    # The EAS project ID isn't secret. Once the project exists, its ID is
    # exposed to app.config.js (a dynamic config) through this repository
    # VARIABLE — see app.config.js's KINWIN_EAS_PROJECT_ID handling. Empty
    # on the very first run, before the project has been created below.
    env:
      KINWIN_EAS_PROJECT_ID: ${{ vars.KINWIN_EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      # Registers the Stripe TEST publishable key for redaction (GitHub's
      # `::add-mask::`) before anything else can echo it. It's read from a
      # repository VARIABLE, not a secret, so GitHub Actions doesn't mask it
      # automatically the way it does for `secrets.*` — this step exists
      # purely so no later step's env/command banner ever prints it in full.
      # Deliberately first, before this value is used anywhere else below.
      - name: Mask the Stripe publishable key in workflow logs
        if: vars.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY != ''
        run: echo "::add-mask::${{ vars.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify EAS authentication
        run: eas whoami

      - name: Check whether an EAS project is already linked
        id: check-link
        run: |
          project_id=$(npx expo config --json | jq -r '.extra.eas.projectId // empty')
          if [ -n "$project_id" ]; then
            echo "Already linked to EAS project $project_id"
            echo "linked=true" >> "$GITHUB_OUTPUT"
          else
            echo "No EAS project linked yet"
            echo "linked=false" >> "$GITHUB_OUTPUT"
          fi

      # app.config.js is a *dynamic* config (JavaScript, not app.json), so no
      # eas-cli command can persist extra.eas.projectId into it automatically
      # — Expo's own CLI refuses to rewrite JS config files. Every EAS
      # command that needs project context hits this same limitation, not
      # just `eas init`, so there's no supported way to create the project
      # and continue toward a build in this same run without already knowing
      # its ID beforehand (confirmed by reading eas-cli's actual init/project
      # ID resolution source; `eas init --json` does not help either, since
      # it throws before producing any JSON when the config is dynamic).
      #
      # So this step only ever creates the project on the server and prints
      # its ID in this log via EAS CLI's own warning message — the ID isn't
      # secret. continue-on-error keeps that log instead of aborting the job
      # here; the explicit failure step below tells the founder exactly what
      # one-time, non-technical action finishes the job:  copy the project
      # ID into the KINWIN_EAS_PROJECT_ID repository *variable* (Settings ->
      # Secrets and variables -> Actions -> Variables — not Secrets, since
      # it's not sensitive), then re-run this workflow. On that re-run,
      # check-link above already resolves the ID from app.config.js and this
      # step is skipped entirely.
      - name: Create the EAS project (first bootstrap run only)
        id: init
        if: steps.check-link.outputs.linked != 'true'
        continue-on-error: true
        run: eas init --force --non-interactive

      - name: EAS project ID not yet available to app.config.js
        if: steps.check-link.outputs.linked != 'true'
        run: |
          echo "::error::The EAS project was created on the server (see the 'Create the EAS project' step's log above for its ID), but app.config.js is a dynamic config so EAS CLI could not persist the ID there automatically. Copy the project ID from that log, then add it as a repository VARIABLE named KINWIN_EAS_PROJECT_ID (GitHub repo -> Settings -> Secrets and variables -> Actions -> Variables tab -> New repository variable; not a secret, the ID isn't sensitive). Re-run this workflow afterward to continue to the build."
          exit 1

      - name: Show EAS project info (non-secret)
        if: steps.check-link.outputs.linked == 'true'
        run: |
          eas project:info
          npx expo config --json | jq '{name, slug, iosBundleIdentifier: .ios.bundleIdentifier, extra}'

      # The beta build gate (scripts/beta-public-config.cjs, triggered by EAS
      # setting EAS_BUILD_PROFILE=beta during `eas build`) requires these in
      # process.env or it fails the build outright. Per docs/IOS_BETA_BUILD.md,
      # these are provided through the EAS "preview" environment, never
      # committed to the repo. `eas env:set` create-or-updates, so this is
      # safe to run every time. All three values are public/client-safe (a
      # Supabase project URL, its publishable anon key, and Kinwin's public
      # support address — the same class of value already embedded in the
      # built app) — not secrets, hence `--visibility plaintext`.
      - name: Configure EAS preview environment (known public values)
        if: steps.check-link.outputs.linked == 'true'
        run: |
          eas env:set --environment preview --name EXPO_PUBLIC_SUPABASE_URL --value "https://ywoledppusxwdonwsewh.supabase.co" --visibility plaintext --non-interactive
          eas env:set --environment preview --name EXPO_PUBLIC_SUPABASE_ANON_KEY --value "sb_publishable_iDayYdsjqPsg5NAwlusz9w_J9gZNzuR" --visibility plaintext --non-interactive
          eas env:set --environment preview --name EXPO_PUBLIC_SUPPORT_EMAIL --value "support@kinwin.app" --visibility plaintext --non-interactive

      # Fail closed rather than silently skipping or forwarding a live/malformed
      # value: this must be a Stripe *TEST* publishable key, never a secret key.
      # Scoped to this one step (not job-level env) so it's the only step
      # whose banner references it at all — already masked by the step above.
      - name: Wire Stripe TEST publishable key into EAS preview environment
        if: steps.check-link.outputs.linked == 'true'
        env:
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY" ]; then
            echo "::error::EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY repository variable is not set."
            exit 1
          fi
          case "$EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY" in
            pk_test_*) ;;
            *) echo "::error::EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY must be a Stripe TEST publishable key (pk_test_...)."; exit 1 ;;
          esac
          eas env:set --environment preview --name EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY --value "$EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY" --visibility plaintext --non-interactive

      # Claims (or reuses) a stable EAS Hosting production URL of the form
      # https://<name>.expo.app — NOT the per-deployment
      # https://<name>--<deployment-id>.expo.app form — since the native app's
      # associated domain must stay the same across web deployments. This is a
      # *plain* export (the beta gate is off): app.config.js's beta validation
      # needs EXPO_PUBLIC_RECIPIENT_INVITATION_BASE_URL, which doesn't exist
      # yet on a first run, so this can't be the real beta export — it exists
      # only to discover/claim the origin.
      - name: Export a plain web build to claim the EAS Hosting origin
        if: steps.check-link.outputs.linked == 'true'
        run: npx expo export --platform web --output-dir dist-bootstrap-web

      # --dev-domain is idempotent: re-running with the project's own
      # already-claimed name succeeds without changing anything, so this step
      # (and the redeploy below) are safe to re-run on every future manual
      # trigger. Two failure modes are handled explicitly, since they're
      # expected, not exceptional: the candidate name is taken by another
      # project (try the next candidate), or this project already claimed a
      # *different* name in a prior run (reuse it instead of erroring).
      - name: Claim a stable EAS Hosting production origin
        id: hosting-origin
        if: steps.check-link.outputs.linked == 'true'
        run: |
          candidates=(kinwin-beta kinwin-beta-1 kinwin-beta-2 kinwin-beta-3 kinwin-beta-4)
          claimed=""
          for name in "${candidates[@]}"; do
            echo "Trying EAS Hosting origin: $name.expo.app"
            if eas deploy --non-interactive --json --prod --dev-domain "$name" --export-dir dist-bootstrap-web --environment preview > /tmp/deploy-bootstrap.json 2> /tmp/deploy-bootstrap.err; then
              claimed="$name"
              break
            fi
            if grep -q "is already set to" /tmp/deploy-bootstrap.err; then
              existing=$(grep -oE '"[a-z0-9-]+\.expo\.app"' /tmp/deploy-bootstrap.err | head -1 | tr -d '"')
              claimed="${existing%.expo.app}"
              echo "This project already has an EAS Hosting origin from a prior run: $claimed.expo.app — reusing it"
              if eas deploy --non-interactive --json --prod --dev-domain "$claimed" --export-dir dist-bootstrap-web --environment preview > /tmp/deploy-bootstrap.json 2> /tmp/deploy-bootstrap.err; then
                break
              fi
              echo "::error::Failed to redeploy to the project's existing EAS Hosting origin ($claimed.expo.app):"
              cat /tmp/deploy-bootstrap.err
              exit 1
            fi
            if grep -q "already taken" /tmp/deploy-bootstrap.err; then
              echo "$name.expo.app is already taken by another project, trying the next candidate"
              continue
            fi
            echo "::error::eas deploy failed for an unexpected reason:"
            cat /tmp/deploy-bootstrap.err
            exit 1
          done
          if [ -z "$claimed" ]; then
            echo "::error::Could not claim any candidate EAS Hosting origin: ${candidates[*]}"
            exit 1
          fi
          origin=$(jq -r '.production.url' /tmp/deploy-bootstrap.json)
          echo "Claimed EAS Hosting origin: $origin"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          echo "dev_domain=$claimed" >> "$GITHUB_OUTPUT"

      # Now that the stable origin is known, produce the real beta web build
      # (all five public values set) and redeploy it to the SAME origin —
      # same --dev-domain, so the URL doesn't change, only the content. AASA
      # generation is deliberately skipped here: it requires a real
      # KINWIN_APPLE_TEAM_ID (see docs/IOS_BETA_BUILD.md), which isn't known
      # yet — that's added once it exists, never invented.
      #
      # --clear is required, not optional: Metro's on-disk transform cache is
      # keyed on file content, not on the live EXPO_PUBLIC_* values baked in by
      # babel-preset-expo's inline-environment-variables plugin. Without it,
      # this export silently reuses the previous step's cached transform of
      # every file that reads process.env.EXPO_PUBLIC_* — including
      # lib/supabase/config.ts — so the deployed bundle ends up with the
      # bootstrap export's config-less values (readSupabaseConfig() always
      # returning null) even though this step's own environment is correct.
      # Confirmed by reproducing the exact failure: two `expo export` runs in
      # the same working directory without --clear produce a byte-identical
      # bundle regardless of differing EXPO_PUBLIC_SUPABASE_* inputs; adding
      # --clear produces a distinct bundle with the live values inlined.
      - name: Export the real beta web build with the discovered origin
        if: steps.check-link.outputs.linked == 'true'
        env:
          KINWIN_VALIDATE_BETA: '1'
          EXPO_PUBLIC_SUPABASE_URL: https://ywoledppusxwdonwsewh.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_iDayYdsjqPsg5NAwlusz9w_J9gZNzuR
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_SUPPORT_EMAIL: support@kinwin.app
          EXPO_PUBLIC_RECIPIENT_INVITATION_BASE_URL: ${{ steps.hosting-origin.outputs.origin }}
        run: npx expo export --platform web --clear --output-dir dist-beta-web

      # Content check, not just a status check: the HTTPS verification step
      # below only proves the server answers 200, which stayed true even when
      # the stale-cache bug above shipped a bundle with no Supabase config at
      # all. Fail closed here, before ever deploying, if the exported bundle
      # doesn't actually contain the TEST Supabase project URL — the public,
      # non-secret signal that EXPO_PUBLIC_SUPABASE_URL was genuinely inlined
      # for this export rather than reused from stale bundler cache.
      - name: Verify the exported bundle actually embeds the TEST Supabase config
        if: steps.check-link.outputs.linked == 'true'
        run: |
          bundle=$(find dist-beta-web/_expo/static/js/web -name 'entry-*.js' | head -1)
          if [ -z "$bundle" ]; then
            echo "::error::No exported web bundle found in dist-beta-web/_expo/static/js/web."
            exit 1
          fi
          if ! grep -q "ywoledppusxwdonwsewh.supabase.co" "$bundle"; then
            echo "::error::Exported beta web bundle does not contain the TEST Supabase project URL. EXPO_PUBLIC_SUPABASE_URL was not inlined into this build (stale bundler cache?) — refusing to deploy a client that cannot connect to Supabase."
            exit 1
          fi
          echo "Confirmed: exported beta bundle embeds the TEST Supabase project configuration."

      - name: Deploy the real beta web build to the same EAS Hosting origin
        if: steps.check-link.outputs.linked == 'true'
        run: eas deploy --non-interactive --json --prod --dev-domain "${{ steps.hosting-origin.outputs.dev_domain }}" --export-dir dist-beta-web --environment preview

      # Uses a harmless dummy token purely to confirm routing — never a real
      # invitation bearer token.
      - name: Verify the real beta web origin over HTTPS
        if: steps.check-link.outputs.linked == 'true'
        run: |
          origin="${{ steps.hosting-origin.outputs.origin }}"
          root_status=$(curl -s -o /dev/null -w '%{http_code}' "$origin/")
          if [ "$root_status" != "200" ]; then
            echo "::error::Beta web origin root did not respond 200 (got $root_status): $origin/"
            exit 1
          fi
          invite_status=$(curl -s -o /dev/null -w '%{http_code}' "$origin/invite/kinwin-routing-verification-only")
          if [ "$invite_status" != "200" ]; then
            echo "::error::/invite/<token> did not resolve to the Expo Router SPA (got $invite_status, expected 200): $origin/invite/<token>"
            exit 1
          fi
          echo "Beta web origin verified over HTTPS: $origin (root and /invite/<token> both 200)"

      - name: Set the real invitation origin in EAS preview environment
        if: steps.check-link.outputs.linked == 'true'
        run: eas env:set --environment preview --name EXPO_PUBLIC_RECIPIENT_INVITATION_BASE_URL --value "${{ steps.hosting-origin.outputs.origin }}" --visibility plaintext --non-interactive

      # Internal distribution, TEST-only config (see scripts/beta-public-config.cjs
      # and eas.json's "beta" profile). Never submits to App Store. If Apple
      # signing credentials don't exist yet for this project, EAS will fail this
      # step with the specific credential step it needs next — that failure is
      # expected on a first run and must not be papered over here.
      #
      # `eas build` sets EAS_BUILD_PROFILE=beta locally (confirmed by
      # reproducing this exact failure: with only that set and none of the
      # five values below, app.config.js's beta gate throws), but it does
      # NOT sync the values already configured in EAS's "preview" environment
      # into its own local pre-flight config resolution — those are only
      # injected into the remote build worker, which local resolution has to
      # succeed before ever reaching. So the same five values the export step
      # needed are needed here too, for the same reason.
      - name: Attempt beta iOS build
        if: steps.check-link.outputs.linked == 'true'
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ywoledppusxwdonwsewh.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_iDayYdsjqPsg5NAwlusz9w_J9gZNzuR
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_SUPPORT_EMAIL: support@kinwin.app
          EXPO_PUBLIC_RECIPIENT_INVITATION_BASE_URL: ${{ steps.hosting-origin.outputs.origin }}
        run: eas build --platform ios --profile beta --non-interactive --wait
