name: Supabase auth, draft & commitment persistence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    name: Typecheck, lint, unit tests, Postgres assertion suite
    runs-on: ubuntu-latest
    # Backstop against any future step hanging silently — the default
    # 360-minute GitHub Actions job timeout is long enough to burn hours of
    # CI time before anyone notices. Every step here normally finishes in
    # well under a minute.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Validate hosted beta verifier syntax
        run: node --check scripts/verify-hosted-beta.mjs

      # ubuntu-latest already ships PostgreSQL (currently 16.x) with its own
      # `postgres` OS role, matching exactly what run.sh and the concurrency
      # proof require — it's just not started by default. The previous
      # version of this step ran `apt-get install -y postgresql` on top of
      # that preinstalled package, which reinstalls/upgrades a unit that
      # manages a systemd service; on ubuntu-latest that can trigger
      # `needrestart`'s interactive "restart services?" prompt, which has no
      # TTY to answer in CI and hangs the job indefinitely. Starting the
      # already-installed service avoids the install (and the prompt)
      # entirely. `timeout-minutes` bounds the wait so a genuine startup
      # failure fails fast instead of hanging again.
      - name: Start PostgreSQL
        timeout-minutes: 2
        run: |
          sudo systemctl start postgresql.service
          for _ in $(seq 1 30); do
            if pg_isready -q; then
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL did not become ready in time." >&2
          exit 1

      # Native Postgres only — proves schema/RLS/triggers/constraints, not
      # the GoTrue/PostgREST layer. See supabase-e2e below for that half,
      # and supabase/tests/README.md for what this suite does and does not
      # cover.
      - name: PostgreSQL migration / RLS / constraint assertion suite
        run: supabase/tests/run.sh

      # Two real, separate Postgres connections timed against each other —
      # proves the owner-level advisory lock (20260904000000_account_
      # deletion_service_role_rpc_and_locking.sql) actually blocks a
      # concurrent session, which run.sh's single-connection, sequential
      # suite cannot exercise.
      - name: Account deletion owner-lock concurrency proof
        run: supabase/tests/concurrency/account_deletion_lock.sh

  supabase-e2e:
    name: GoTrue + PostgREST end-to-end (real local Supabase stack)
    runs-on: ubuntu-latest
    # Backstop against a step hanging silently rather than failing fast —
    # this job normally completes in well under 10 minutes on a green run;
    # 30 keeps real headroom for a slow `supabase start` (Docker image
    # pulls) without ever approaching GitHub's own 360-minute default,
    # which is what let a previous "Install PostgreSQL client" apt-get
    # hang burn hours of CI time before anyone noticed. See that step's
    # own comment below for the specific bug this also fixes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # supabase/functions/**/*.ts targets the Deno runtime (npm: specifiers,
      # `.ts`-suffixed relative imports, `Deno.*` globals) and is deliberately
      # excluded from tsconfig.json's own `npm run typecheck` (see that
      # file's `exclude`) — Node's TypeScript cannot resolve any of that. This
      # is that code's only static check: a real `deno check` against the
      # real Deno type-checker, run before the slower `supabase start` step
      # below so a Deno-specific mistake fails fast and clearly here rather
      # than surfacing as a confusing runtime 500 deep in the e2e suite.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Run from inside supabase/functions/ (not the repo root) so Deno's
      # config-file discovery — which walks up from the working directory,
      # never down into subdirectories — actually finds
      # supabase/functions/deno.json and its nodeModulesDir: "auto" (from
      # the repo root, Deno instead saw only the unrelated root
      # package.json — the mobile app's — and refused to auto-resolve the
      # npm: specifiers).
      - name: Typecheck Edge Functions with Deno
        working-directory: supabase/functions
        run: deno check **/*.ts ../../scripts/verify-tremendous-testflight.ts

      # Placeholder-only Stripe secrets for the local Edge Runtime — never
      # real credentials, and this workflow never requests or invents real
      # ones (see supabase/tests/e2e/consequence-setup-stripe.e2e.ts's own
      # header comment). `supabase start` auto-loads this file for every
      # local Edge Function. The webhook signing secret is also exported to
      # $GITHUB_ENV so the Node e2e suite can sign requests with the exact
      # same value the running function verifies against.
      - name: Write placeholder Stripe secrets for the local Edge Runtime
        run: |
          mkdir -p supabase/functions
          cat > supabase/functions/.env <<'EOF'
          STRIPE_SECRET_KEY=sk_test_placeholder_not_a_real_key_ci_only
          STRIPE_WEBHOOK_SIGNING_SECRET=whsec_placeholder_not_a_real_secret_ci_only
          EOF
          echo "STRIPE_WEBHOOK_SIGNING_SECRET=whsec_placeholder_not_a_real_secret_ci_only" >> "$GITHUB_ENV"

      # Runs the full local stack (Postgres, GoTrue, PostgREST, Kong, Edge
      # Runtime, ...) via Docker Compose, which GitHub-hosted runners have
      # preinstalled. Applies every file under supabase/migrations/ in
      # filename order and serves every function under supabase/functions/
      # on first boot, same as a hosted project would. Never touches a
      # hosted project or production credentials — supabase/config.toml is
      # local-only.
      - name: Start local Supabase and apply migrations
        run: supabase start

      # Local-dev-only URL/anon key printed by `supabase start` — the same
      # well-known values for every fresh local project, never a secret.
      # `-o env` quotes each value (KEY="value"); $GITHUB_ENV does not strip
      # shell quoting, so appending it verbatim would set e.g. SUPABASE_URL
      # to the literal string `"http://127.0.0.1:54321"`, quote characters
      # included — sed strips exactly that one matching pair per line.
      # SERVICE_ROLE_KEY is local-dev-only (same well-known value for every
      # fresh `supabase start`, never a secret) — needed only by
      # full-activation-and-check-in.e2e.ts, which is the first suite that
      # has to simulate "a verified Stripe webhook already authorized this
      # consequence" directly (no RPC lets even an authenticated owner set
      # authorization_status themselves, by design), rather than re-driving
      # the real webhook flow consequence-setup-stripe.e2e.ts already covers.
      # SUPABASE_DB_URL (the local `supabase start` Postgres connection
      # string, also local-dev-only/never a secret) is needed only by
      # account-deletion.e2e.ts, to insert `private` schema fixture rows
      # (consequence_charge_attempts, reward_fulfillments) directly — those
      # tables are deliberately unreachable through PostgREST/supabase-js
      # (see 050_private_schema_isolation.sql and this suite's own
      # unreachability test), so a fixture needing one goes straight to
      # Postgres via psql instead, never through a new production RPC.
      - name: Export local Supabase connection details
        run: |
          supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            --override-name db.url=SUPABASE_DB_URL \
            | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' \
            >> "$GITHUB_ENV"

      # psql itself (account-deletion.e2e.ts's only way to reach the
      # `private` schema for fixture setup — see above). ubuntu-latest
      # already ships PostgreSQL client tools preinstalled (the `checks`
      # job above relies on this same fact for `pg_isready`/`psql`, and
      # that job's own comment explains why installing on top of it is
      # unsafe) — `apt-get install` here previously hung this job
      # indefinitely: `apt-get update` against the Ubuntu/Azure package
      # mirrors stalled with no bound (confirmed via a real cancelled run:
      # every step through `supabase start` and its health checks
      # succeeded, then this step sat until GitHub's ~6-hour ceiling
      # killed the job — the E2E suite itself never even ran). This step
      # now only verifies the preinstalled client exists: no network
      # call, so nothing here can hang, and it still fails fast and
      # clearly if a future runner image ever drops it.
      - name: Verify PostgreSQL client is preinstalled
        timeout-minutes: 1
        run: |
          command -v psql
          psql --version

      - name: Auth, draft-persistence, prepare_challenge_from_draft, cancel_pending_challenge, server-generated-periods, consequence-setup-stripe, and full-activation-and-check-in end-to-end suite against real GoTrue/PostgREST/Edge Runtime
        run: npm run test:e2e

      - name: Stop local Supabase
        if: always()
        run: supabase stop
